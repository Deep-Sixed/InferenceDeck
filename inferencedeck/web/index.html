<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InferenceDeck</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><strong>InferenceDeck</strong><span id="api-state">connecting…</span></header>
<main>
  <section class="card">
    <h2>Status</h2>
    <div id="status" class="muted">Loading…</div>
    <div id="server-actions"></div>
  </section>
  <section class="card">
    <h2>Profiles</h2>
    <div id="profiles" class="list"></div>
  </section>
  <section class="card">
    <h2>Remote & cloud models</h2>
    <div id="remotes" class="list"></div>
    <div class="actions"><button onclick="setRemote('disable')">Disable remote/cloud model</button></div>
  </section>
  <section class="card">
    <h2>Tracked servers</h2>
    <div id="servers" class="list"></div>
  </section>
  <section class="card">
    <h2>Active command</h2>
    <pre id="command">—</pre>
  </section>
  <section class="card">
    <h2>Hardware</h2>
    <div id="hardware" class="muted">Loading…</div>
  </section>
  <section class="card">
    <h2>Fit & benchmark</h2>
    <div id="performance" class="list"><span class="muted">Choose Fit or Benchmark on a profile.</span></div>
  </section>
  <section class="card">
    <h2>Runtime inventory</h2>
    <div id="inventory" class="muted">Loading…</div>
  </section>
  <section class="card">
    <h2>Benchmark history</h2>
    <div id="benchmarks" class="list"></div>
  </section>
</main>
<div id="login" class="overlay hidden">
  <form id="login-form" class="login-card">
    <h2>Sign in</h2>
    <input id="login-user" autocomplete="username" placeholder="Username" value="admin">
    <input id="login-password" autocomplete="current-password" type="password" placeholder="Password">
    <button class="primary" type="submit">Sign in</button>
    <div id="login-error" class="muted"></div>
  </form>
</div>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
