name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[tray]
      - run: python -m unittest discover -s tests -v
      # Editable installs hide missing package data; check a real wheel.
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); missing = [f for f in ('index.html', 'app.js', 'styles.css') if 'inferencedeck/web/' + f not in names]; assert not missing, missing"
