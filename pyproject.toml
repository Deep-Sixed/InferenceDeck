[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inferencedeck"
version = "0.1.0"
description = "Cross-platform control plane for local AI inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gguf"]

[project.scripts]
inferencedeck = "inferencedeck.cli:main"

[tool.setuptools.packages.find]
include = ["inferencedeck*"]
