[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inferencedeck"
version = "0.1.0"
description = "Cross-platform control plane for local AI inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gguf"]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=9"]

[project.scripts]
inferencedeck = "inferencedeck.cli:main"
inferencedeck-web = "inferencedeck.webui:main"
inferencedeck-gateway = "inferencedeck.gateway.server:main"

# A GUI program on Windows: no console window.
[project.gui-scripts]
inferencedeck-tray = "inferencedeck.tray:main"

[tool.setuptools.packages.find]
include = ["inferencedeck*"]

# The web UI's files; without this, built wheels ship no HTML/JS/CSS.
[tool.setuptools.package-data]
inferencedeck = ["web/*.html", "web/*.js", "web/*.css"]
